<!DOCTYPE html>
<html lang="en">

<head>
    <title>Cover Flow</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="La mente extendida de valira">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:ital,wght@0,300..700;1,300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">

    <style>
        :root {
            --album-size: 192px;
            --album-perspective: calc(var(--album-size) * 4);
        }

        .cards {
            display: flex;
            align-items: center;
            overflow-x: auto;

            list-style: none;
            margin: 0;
            padding: 0 calc(50% - var(--album-size) / 2);

            scroll-snap-type: x mandatory;

            height: 200px;
        }

        .album {
            flex: 0 0 var(--album-size);

            scroll-snap-align: center;

            perspective: var(--album-perspective);
        }

        .album > a {
            display: block;
            transform-style: preserve-3d;
        }

        .album img {
            display: block;
            width: 100%;
            aspect-ratio: 1;
        }
    </style>
</head>

<body>
    <main>
        <article>
            <section class="albums">
                <ul class="cards">
                    <li class="album">
                        <a href="https://open.spotify.com/intl-es/album/6dqnfkFIk2k450lqaCPTKq">
                            <img src="https://lastfm.freetls.fastly.net/i/u/770x0/cd63b835a56cfa83564f4de288fa8194.jpg#cd63b835a56cfa83564f4de288fa8194" loading="lazy" alt="Turboviolencia - VVV[Trippin' you]">
                        </a>
                        <template>
                            <div class="cover-info">
                                <p><b>VVV [Trippin'you]</b></p>
                                <small>Artist</small>
                                <small><i>bakala, techno, post-punk</i></small>
                            </div>
                            <div class="info">
                                <p>
                                    In 2021 I went to a Depresión Sonora concert and VVV were the opening act. I did not know nothing about them and I fell in love with their performance and their music. Even more than Depresión Sonora.  
                                </p>
                                <p>Since then, this band has been on my most listened artist on Spotify two years in a row! I love the depressive, angry and radical sound that they have going on.</p>
                                <p>I have many favourite tracks, but you should listen to <a href="https://open.spotify.com/intl-es/track/2vlCD96gbODeKevuusi8Ic">Destrucción</a>.</p>
                            </div>
                        </template>
                    </li>
                    <li class="album">
                        <a href="https://open.spotify.com/intl-es/album/6dqnfkFIk2k450lqaCPTKq">
                            <img src="https://lastfm.freetls.fastly.net/i/u/770x0/11dd7e48a1f042c688bf54985f01d088.jpg#11dd7e48a1f042c688bf54985f01d088" loading="lazy" alt="Random Access Memories - Daft Punk">
                        </a>
                        <template>
                            <div class="cover-info">
                                <p><b>Daft Punk</b></p>
                                <small>Artist</small>
                                <small><i>electronic, french, 90's</i></small>
                            </div>
                            <div class="info">
                                <p>
                                    For the few of you who might not who Daft Punk are, they are an electronic dance music french duo. They made a big impact in house music, electronic music during the 90's and 00's and their music is simply sublime. 
                                </p>
                                <p>They have 4 absurdly good albums, although if you ask me about my favourite of them it would be <a href="https://open.spotify.com/intl-es/album/2noRn2Aes5aoNVsU6iWThc">Discovery</a>. I have <a href="https://open.spotify.com/intl-es/album/4m2880jivSbbyEGAKfITCa">Random Access Memories</a> on vinyl, and it's definitely an experience. <br></p>

                                <p>

                                    Honestly you should just go and listen to them, you'll thank me afterwards.
                                </p>
                                <p>
                                    P.S: You should listen to <a href="https://open.spotify.com/intl-es/track/7oaEjLP2dTJLJsITbAxTOz">Touch</a>.
                                </p>
                            </div>
                        </template>
                    </li>
                    <li class="album">
                        <a href="https://open.spotify.com/intl-es/album/7GiLfxL1su3MSqz7pmKMZi">
                            <img src="https://lastfm.freetls.fastly.net/i/u/770x0/6056294021058eaee7ceafc184d297d2.jpg#6056294021058eaee7ceafc184d297d2" loading="lazy" alt="">
                        </a>
                        <template>
                            <div class="cover-info">
                                <p><b>Turnstiles (1976)</b></p>
                                <small>Album</small>
                                <small><i>classic rock, piano</i></small>
                            </div>
                            <div class="info">
                                <p>
                                    In 2025 while doing my annual weekly playlist, I stumbled upon Billy Joel's <i>Turnstiles</i>. And its very good! 
                                </p>
                                <p>
                                    This 1976 album is only a 36min run but i don't think it needs a longer playtime. It catches you just long enough for you to enjoy it and then sets you free. Hit song <a href="https://open.spotify.com/intl-es/track/6yjKlmm7vOszkXEUku1EM1">New York State of Mind</a> is a 6 minute <i>banger</i> of a song. But this record has many more songs that are worth listening, like <a href="https://open.spotify.com/intl-es/track/6TiehatA3uffBiejWLMi7Z">I've Loved These Days</a>.
                                </p>
                                <p>
                                    I've always listened to classic rock albums, mostly because of my dad, and became a fan of the style. This sounds like an album my dad would have in his vinyl collection.
                                </p>
                            </div>
                        </template>
                    </li>
                </ul>
                <div class="description"></div>
            </section>
        </article>
    </main>
    

    <script>
        const cards = document.querySelector(".cards");
        const albums = [...document.querySelectorAll(".album")];
        const description = document.querySelector(".description");

        const MAX_ROTATION = 65;
        const ROTATION_FACTOR = .18;

        function updateRotations() {
            const center = window.innerWidth / 2;
            albums.forEach(album => {

                const rect = album.getBoundingClientRect();

                let rotation =
                    (rect.left + rect.width / 2 - center)
                    * ROTATION_FACTOR;

                rotation = Math.max(
                    -MAX_ROTATION,
                    Math.min(MAX_ROTATION, rotation)
                );

                album.firstElementChild.style.transform =
                    `rotateY(${-rotation}deg)`;

                if (Math.abs(rotation) < 1)
                    display(album);
            });

        }

        function display(album) {
            description.replaceChildren(
                album.querySelector("template")
                    .content
                    .cloneNode(true)
            );
        }

        updateRotations()

        cards.addEventListener("scroll", ()=>{
            updateRotations()
        })

    </script>
</body>

</html>
