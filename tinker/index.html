<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Flow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .cards-wrapper{
            border: 1px solid;
            width: 1700px;
            height: fit-content;
            overflow-x: scroll;
        }

        .cards{
            list-style-type: none;
            display: flex;
            column-gap: 1em;
            
        }

        .cards li{
            perspective: calc(192px * 4);
        }

        .album{
            display: flex;
            align-items: center;
            justify-content: center;
            
            height: 192px;
            aspect-ratio: 1;

            transform-style: preserve-3d;
        }
    </style>
</head>

<body>
    <div class="cards-wrapper">
        <ul class="cards">
            <li>
                <picture class="album">
                    <source srcset="https://lastfm.freetls.fastly.net/i/u/770x0/11dd7e48a1f042c688bf54985f01d088.jpg#11dd7e48a1f042c688bf54985f01d088">
                    <img src="" alt="" height="100%">
                </picture>
            </li>
            <li>
                <div class="album" style="background:#ff4d4d">1asd</div>
            </li>
            <li>
                <div class="album" style="background:#ff4d4d">1asd</div>
            </li>
            <li>
                <picture class="album">
                    <source srcset="https://lastfm.freetls.fastly.net/i/u/770x0/11dd7e48a1f042c688bf54985f01d088.jpg#11dd7e48a1f042c688bf54985f01d088">
                    <img src="" alt="" height="100%">
                </picture>
            </li>
            <li>
                <picture class="album">
                    <source srcset="https://lastfm.freetls.fastly.net/i/u/770x0/11dd7e48a1f042c688bf54985f01d088.jpg#11dd7e48a1f042c688bf54985f01d088">
                    <img src="" alt="" height="100%">
                </picture>
            </li>
            <li>
                <picture class="album">
                    <source srcset="https://lastfm.freetls.fastly.net/i/u/770x0/11dd7e48a1f042c688bf54985f01d088.jpg#11dd7e48a1f042c688bf54985f01d088">
                    <img src="" alt="" height="100%">
                </picture>
            </li>
            <li>
                <div class="album" style="background:#ff4d4d">1asd</div>
            </li>
            <li>
                <div class="album" style="background:#ff4d4d">1asd</div>
            </li>
            <li>
                <div class="album" style="background:#ff4d4d">1asd</div>
            </li>
            <li>
                <div class="album" style="background:#ff4d4d">1asd</div>
            </li>
            <li>
                <div class="album" style="background:#ff4d4d">1asd</div>
            </li>
            <li>
                <div class="album" style="background:#ff4d4d">1asd</div>
            </li>
            <li>
                <div class="album" style="background:#ff4d4d">1asd</div>
            </li>
        </ul>
    </div>

    <script>
        const wrapper = document.querySelector(".cards-wrapper");
        const albums = document.querySelectorAll(".album");

        const MAX_ROTATION = 65;   // degrees
        const ROTATION_FACTOR = 0.18;

        function updateRotations() {
            const wrapperCenter =
                wrapper.scrollLeft + wrapper.clientWidth / 2;
                // document.documentElement.scrollLeft + wrapper.clientWidth / 2; //document.documentElement is root element of DOM (<html>)

            albums.forEach(album => {
                const rect = album.parentElement;

                const albumCenter =
                    rect.offsetLeft + rect.offsetWidth / 2;

                const distance = albumCenter - wrapperCenter;

                let rotation = distance * ROTATION_FACTOR;

                rotation = Math.max(
                    -MAX_ROTATION,
                    Math.min(MAX_ROTATION, rotation)
                );

                album.style.transform = `rotateY(${rotation}deg)`;
            });
        }

        // window.addEventListener("scroll", updateRotations);
        wrapper.addEventListener("scroll", updateRotations);
        window.addEventListener("resize", updateRotations);

        updateRotations();

    </script>
</body>

</html>
