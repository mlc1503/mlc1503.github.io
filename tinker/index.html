<!DOCTYPE html>
<html lang="en">

<head>
    <title>Cover Flow</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="La mente extendida de valira">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:ital,wght@0,300..700;1,300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">

    <style>
        * {
            box-sizing: border-box;
        }

        .cards-wrapper {
            border: 1px solid;
            width: 100%;
            height: fit-content;
            overflow-x: scroll;

            scroll-snap-type: x mandatory;
        }

        .cards {
            list-style-type: none;
            display: flex;

            padding: 0;
        }

        .cards li {
            perspective: calc(192px * 4);
            scroll-snap-align: center;
            scroll-padding: 0;
        }

        .album {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 192px;
            aspect-ratio: 1;
            scroll-padding: 0;

            transform-style: preserve-3d;
        }
    </style>
</head>

<body>

    <div class="text"></div>

    <template>
        <p>21354543</p>
    </template>
    
    <script>
        const wrapper = document.querySelector(".cards-wrapper");
        const albums = document.querySelectorAll(".album");
        const spacers = document.querySelectorAll(".spacer")

        const MAX_ROTATION = 65;   // degrees
        const ROTATION_FACTOR = 0.18;


        function updateMargins() {

            const DISTANCE_TO_CENTER = document.documentElement.clientWidth / 2
            const HALF_ALBUM = albums[0].clientWidth / 2

            spacers.forEach(spacer => {
                // spacer_width = distance_to_center - half_album 
                spacer.style.minWidth = `${DISTANCE_TO_CENTER - HALF_ALBUM}px`
            });
        }


        function updateRotations() {
            const wrapperCenter = wrapper.scrollLeft + wrapper.clientWidth / 2;

            albums.forEach(album => {
                const rect = album.parentElement;

                const albumCenter =
                    rect.offsetLeft + rect.offsetWidth / 2;

                const distance = albumCenter - wrapperCenter;

                let rotation = distance * ROTATION_FACTOR;

                rotation = Math.max(
                    -MAX_ROTATION,
                    Math.min(MAX_ROTATION, rotation)
                );

                album.style.transform = `rotateY(${rotation}deg)`;
            });
        }

        function loadText(id) {
            let text = document.querySelector(".text")
            const templates = document.getElementsByTagName("template")

            text.textContent = ''

            if (id == undefined || id == null || id == '') {
                text.innerHTML = ''
            }
            else {
                let template = templates.item(id)
                if(template != null){
                    text.appendChild(template.content.cloneNode(true))
                }
            }
        }

        window.addEventListener("resize", updateMargins);
        wrapper.addEventListener("scroll", updateRotations);
        wrapper.addEventListener("scrollsnapchanging", (event) =>{

            const snappedElement = event.snapTargetBlock || event.snapTargetInline

            if(snapToElement.id != ''){
                loadText(snappedElement.id)
            }

        })


        function snapToElement() {
            
        }


        updateMargins();
        updateRotations();
        snapToElement();

    </script>
</body>

</html>
